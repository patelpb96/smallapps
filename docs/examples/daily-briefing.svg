    <g transform="translate(14,19.5) scale(0.86)" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M8 2.4a5.6 5.6 0 1 0 0 11.2A5.6 5.6 0 1 0 8 2.4M8 5v3.3l2.3 1.4"/></g>
    <text font-size="12.5" font-weight="520" fill="#1b1b19"><tspan x="41" y="27.5">Every morning at 7am</tspan></text>
    <text x="41" y="44.5" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="#7c3aed" opacity="0.85">SCHEDULE</text>
    
    
  </g>
<g class="node" data-node="n2" data-shape="rect" transform="translate(416,166)">
