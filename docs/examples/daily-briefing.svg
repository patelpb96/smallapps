    <text font-size="12.5" font-weight="520" fill="#1b1b19"><tspan x="41" y="27.5">Drafts a briefing</tspan></text>
    <text x="41" y="44.5" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="#1d4ed8" opacity="0.85">LLM STEP</text>
    
    
