    <text font-size="12.5" font-weight="520" fill="#1b1b19"><tspan x="41" y="28.0">Searches for new filings from</tspan><tspan x="41" y="43.0">our watchlist</tspan></text>
    <text x="41" y="60.0" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="#0f766e" opacity="0.85">WEB SEARCH</text>
    <circle cx="266" cy="7" r="2.6" fill="#be123c"><title>untrusted input</title></circle>
    
  </g>
<g class="node" data-node="n3" data-shape="round" transform="translate(747,174)">
    <rect x="1" y="1" width="204" height="56" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
    <g transform="translate(14,19.5) scale(0.86)" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M3 4.8h9.4 M3 8h9.4 M3 11.2h6"/></g>
    <text font-size="12.5" font-weight="520" fill="#1b1b19"><tspan x="41" y="27.5">Summarises each one</tspan></text>
    <text x="41" y="44.5" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="#1d4ed8" opacity="0.85">SUMMARISE</text>
    
    
