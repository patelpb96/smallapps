    <g transform="translate(14,19.5) scale(0.86)" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M8 7.1a.9.9 0 1 0 0 1.8.9.9 0 1 0 0-1.8 M5.3 5.3a3.9 3.9 0 0 0 0 5.4 M10.7 5.3a3.9 3.9 0 0 1 0 5.4 M3 3a7 7 0 0 0 0 10 M13 3a7 7 0 0 1 0 10"/></g>
    <text font-size="12.5" font-weight="520" fill="#1b1b19"><tspan x="41" y="27.5">Published to the intranet</tspan></text>
