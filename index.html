<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smallapps</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    background: #fbfbfa; color: #1b1b19; padding: 32px;
  }
  @media (prefers-color-scheme: dark) { body { background: #131313; color: #ececea; } }
  main { max-width: 620px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .mark { font-size: 30px; line-height: 1; display: block; margin-bottom: 14px; opacity: .8; }
  p { color: #55554f; margin: 0 0 26px; }
  @media (prefers-color-scheme: dark) { p { color: #a8a8a2; } }
  a.app {
    display: block; padding: 16px 18px; border: 1px solid #e2e2dd; border-radius: 12px;
    text-decoration: none; color: inherit; transition: border-color .15s, transform .15s;
  }
  a.app:hover { border-color: #3b5bdb; transform: translateY(-1px); }
  @media (prefers-color-scheme: dark) { a.app { border-color: #2b2b28; } }
  .title { font-weight: 600; font-size: 15px; }
  .desc { font-size: 13px; color: #86867e; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <span class="mark">◇</span>
  <h1>smallapps</h1>
  <p>Small, dependency-free tools. No build step, no framework — open the file and it runs.</p>
  <a class="app" href="./apps/agent-plan/">
    <div class="title">Agent workflow planner</div>
    <div class="desc">Autonomy tier, sandbox floor, and 70 cited controls for an agentic workflow you are about to build.</div>
  </a>
</main>
</body>
</html>
